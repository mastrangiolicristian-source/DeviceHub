# Reverse proxy per l'API HTTP (porta 8010).
# La porta TCP 5027 dei tracker NON passa da nginx: e' traffico binario
# Teltonika, va esposta direttamente e in chiaro (i device non fanno TLS).

server {
    listen      80;
    listen      [::]:80;
    server_name api.example.com;

    # Lasciare solo il redirect se si usa certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # L'API espone posizioni e comandi: non indicizzare, non cachare.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;

    client_max_body_size 1m;

    location / {
        proxy_pass         http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
